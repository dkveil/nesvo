<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -6 59 19" width="1180" height="380" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">nesvo</title><desc id="desc">Pikselowy robot zastępuje literę n. Korpus wszystkich liter ma identyczną wysokość. Oko mruga, a odłączony piksel wraca do korpusu.</desc>
<style>
.eyelid { opacity:0; animation: close-eye 6s step-end infinite; }
@keyframes close-eye { 0%,13%,18%,65%,70%,100% { opacity:0 } 14%,17%,66%,69% { opacity:1 } }
.eye { animation: look 6s step-end infinite, blink 6s step-end infinite; }
.satellite { animation: orbit 6s step-end infinite; }
@keyframes look { 0%,18% { transform:translateX(0) } 24%,36% { transform:translateX(1px) } 42%,54% { transform:translateX(-1px) } 60%,100% { transform:translateX(0) } }
@keyframes blink { 0%,13%,18%,65%,70%,100% { opacity:1 } 14%,17%,66%,69% { opacity:0 } }
@keyframes orbit { 0%,20%,100% { transform:translateY(0) } 25%,40% { transform:translateY(-1px) } 45%,60% { transform:translateY(0) } 65%,70% { transform:translateY(1px) } 75%,85% { transform:translateY(3px) } 90%,95% { transform:translateY(1px) } }
.paused * { animation-play-state:paused!important; }
@media (prefers-reduced-motion:reduce) { .eye,.satellite,.eyelid { animation:none; } }

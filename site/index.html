<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Nesvo — supervise your AI coding sessions</title>
    <meta
      name="description"
      content="Nesvo is a desktop app for running and supervising AI coding sessions with the Claude Code and Codex CLIs you already use."
    />
    <link rel="canonical" href="https://nesvo.dev/" />
    <meta property="og:title" content="Nesvo" />
    <meta
      property="og:description"
      content="Run and supervise AI coding sessions with the Claude Code and Codex CLIs you already use."
    />
    <meta property="og:url" content="https://nesvo.dev/" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <h1 class="wordmark">
        <svg
          viewBox="18 18 372 64"
          role="img"
          aria-label="Nesvo"
          focusable="false"
        >
          <g fill="currentColor" fill-rule="evenodd">
            <g transform="translate(18 18)">
              <path class="letter" d="M0 64V0H40L64 24V64H44V32L32 20H20V64Z" />
            </g>
            <g transform="translate(96 18)">
              <path
                class="letter"
                d="M0 0H44L60 16H20V24H50V40H20V48H60V64H0Z"
              />
            </g>
            <g transform="translate(170 18)">
              <path
                class="letter"
                d="M16 0H64V16H20V24H48L64 40V48L48 64H0V48H44V40H16L0 24V16Z"
              />
            </g>
            <g transform="translate(248 18)">
              <path
                class="letter"
                d="M0 0H20V32L32 44L44 32V0H64V40L40 64H24L0 40Z"
              />
            </g>
            <g transform="translate(326 18)">
              <path
                class="letter"
                d="M0 0H40L64 24V64H24L0 40ZM20 20V32L32 44H44V32L32 20Z"
              />
            </g>
          </g>
        </svg>
      </h1>

      <p class="tagline">
        A desktop app to run and supervise AI coding sessions with the Claude
        Code and Codex CLIs you already use.
      </p>

      <section class="download" data-download aria-label="Download">
        <a
          class="download-button"
          href="/releases"
          data-primary
          data-state="idle"
        >
          <span class="download-glow" aria-hidden="true"></span>
          <span class="download-tile" aria-hidden="true">
            <svg class="glyph" viewBox="0 0 64 64" focusable="false">
              <g class="glyph-mark" fill="currentColor">
                <path class="glyph-stem" d="M0 0H20V64H0Z" />
                <path class="glyph-arch" d="M20 0H40L64 24V32H44L32 20H20Z" />
                <path class="glyph-leg" d="M44 32H64V64H44Z" />
              </g>
              <path
                class="glyph-arrow"
                fill="currentColor"
                d="M22 4H42V34H56L32 58L8 34H22Z"
              />
            </svg>
          </span>
          <span class="download-text">
            <span class="download-label" data-label>Download Nesvo</span>
            <span class="download-detail" data-detail>Windows and macOS</span>
          </span>
          <span class="download-sweep" aria-hidden="true"></span>
        </a>

        <p class="download-alt" data-intel hidden>
          Intel Mac? <a href="/download/mac-intel">Get the Intel build</a>
        </p>

        <nav class="platforms" aria-label="Other downloads">
          <a href="/download/windows" data-platform-link="windows">Windows</a>
          <a href="/download/mac" data-platform-link="mac">macOS</a>
          <a href="/download/mac-intel" data-platform-link="mac-intel"
            >Intel Mac</a
          >
          <span class="platforms-divider" aria-hidden="true"></span>
          <a href="/github">GitHub</a>
          <a href="/releases" data-platform-link="other">All releases</a>
        </nav>

        <p class="first-launch" data-note role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer class="footer">
      <span>Unsigned builds without automatic updates.</span>
      <a href="https://github.com/dkveil/nesvo/blob/master/LICENSE"
        >MIT License</a
      >
      <span>© 2026 Damian Kądziela</span>
    </footer>
  </body>
</html>

[package]
name = "nesvo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "nesvo: native terminal client for shared host sessions"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
nesvo-host = { path = "../host" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2.5"
vt100 = "0.16"


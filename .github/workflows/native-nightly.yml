name: Native nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Build native host and client
        id: native-build
        run: cargo build --workspace --locked
      - name: Verify Windows statusline raw standard handles
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 10
        run: cargo test --package nesvo-host --bin nesvo-host --locked claude_statusline::tests::generated_windows_command_inherits_raw_standard_handles -- --ignored --exact --test-threads=1
      - name: Verify Windows Git metadata descendant containment
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 10
        run: cargo test --package nesvo-host --bin nesvo-host --locked git_repository::helper::tests::windows_waiting_helper_cancellation_contains_wrapper_descendants_before_releasing_capacity -- --ignored --exact --test-threads=1
      - name: Verify native SDK host scenarios
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 30
        run: cargo test --package nesvo --test mcp_host --locked -- --ignored --test-threads=1

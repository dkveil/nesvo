name: Native nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9
      - name: Build native host and client
        id: native-build
        run: cargo build --workspace --locked
      - name: Record console hosts before tests
        id: console-hosts-before-tests
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/console-orphans.ps1 -Snapshot "$env:RUNNER_TEMP/console-hosts-before-tests.json"
      - name: Verify Windows statusline raw standard handles
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 10
        run: cargo test --package nesvo-host --bin nesvo-host --locked claude_statusline::tests::generated_windows_command_inherits_raw_standard_handles -- --ignored --exact --test-threads=1
      - name: Verify Windows Git metadata descendant containment
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 10
        run: cargo test --package nesvo-host --bin nesvo-host --locked git_repository::helper::tests::windows_waiting_helper_cancellation_contains_wrapper_descendants_before_releasing_capacity -- --ignored --exact --test-threads=1
      - name: Verify native SDK host scenarios
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 30
        run: cargo nextest run --package nesvo --test mcp_host --locked --profile ci --run-ignored ignored-only --test-threads 1
      - name: Fail on console hosts left by tests
        if: ${{ always() && steps.console-hosts-before-tests.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/console-orphans.ps1 -Check "$env:RUNNER_TEMP/console-hosts-before-tests.json"

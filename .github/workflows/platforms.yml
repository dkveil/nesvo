name: Native desktop checks
on:
  push:
    branches: [master]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["windows-latest", "macos-latest"]' || github.event_name == 'schedule' && '["macos-latest"]' || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: runner.os == 'macOS'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
        if: runner.os == 'macOS' || github.event_name == 'workflow_dispatch'
        shell: bash
      - name: Measure Windows PowerShell compilation under the host scan environment
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.mjs" <<'EOF'
          import { spawnSync } from 'node:child_process';
          const env = { LC_ALL: 'C', LANG: 'C' };
          for (const name of ['PATH', 'SystemRoot', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'HOME', 'USERPROFILE'])
            if (process.env[name]) env[name] = process.env[name];
          const started = Date.now();
          const result = spawnSync(
            process.env.SystemRoot + '\\System32\\WindowsPowerShell\\v1.0\\powershell.exe',
            ['-NoProfile', '-NonInteractive', '-Command', 'Add-Type -TypeDefinition "public class Probe { }"; "compiled"'],
            { env, encoding: 'utf8', timeout: 60000, windowsHide: true },
          );
          console.log(JSON.stringify({ elapsedMs: Date.now() - started, status: result.status, error: String(result.error ?? ''), stdout: result.stdout, stderr: result.stderr }));
          EOF
          node "$RUNNER_TEMP/probe.mjs"
      - run: bun run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check native package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export NESVO_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/release/win-unpacked/Nesvo.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export NESVO_PACKAGED_EXECUTABLE="$(find "$GITHUB_WORKSPACE/apps/desktop/release" -path '*/Contents/MacOS/Nesvo' -type f -print -quit)"
          else
            export NESVO_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/release/linux-unpacked/nesvo"
          fi
          test -f "$NESVO_PACKAGED_EXECUTABLE"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bun run smoke:desktop:package
          else
            bun run smoke:desktop:package
          fi
      - name: Check unpackaged desktop
        if: runner.os == 'macOS' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bun run smoke:desktop
          else
            bun run smoke:desktop
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'workflow_dispatch'
        with:
          name: nesvo-desktop-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/release/
          retention-days: 3

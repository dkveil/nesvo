name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 300 || 35 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Check desktop release version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Release tag %s must match apps/desktop/package.json version (expected v%s).\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build Windows x64 installer
        if: runner.os == 'Windows'
        run: bun run --cwd apps/desktop electron-builder --win nsis --x64 --publish never
      - name: Build Apple silicon and Intel disk images
        id: mac-release
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          config=electron-builder.yml
          signed=false
          if [[ -n "$CSC_LINK" ]]; then
            for name in CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
              if [[ -z "${!name}" ]]; then
                printf 'Missing macOS release secret: %s\n' "$name" >&2
                exit 1
              fi
            done
            if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
              printf 'Invalid Apple Developer Team ID format.\n' >&2
              exit 1
            fi
            if [[ ! "$APPLE_API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
              printf 'Invalid App Store Connect API Key ID format.\n' >&2
              exit 1
            fi

            key_dir="$(mktemp -d "$RUNNER_TEMP/nesvo-notary.XXXXXX")"
            key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
            trap 'rm -f "$key_path"; rmdir "$key_dir"' EXIT
            (umask 077; printf '%s\n' "$APPLE_API_KEY" > "$key_path")
            export APPLE_API_KEY="$key_path"
            export CSC_NAME="($APPLE_TEAM_ID)"
            config=electron-builder.macos-signed.yml
            signed=true
            requirement="=anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
          fi

          build_image() {
            local arch="$1" mach_arch="$2" app="$3" binary
            local dmg="apps/desktop/release/Nesvo-macOS-$arch.dmg"
            bun run --cwd apps/desktop electron-builder --config "$config" --mac dmg "--$arch" --publish never
            lipo "$app/Contents/MacOS/Nesvo" -verify_arch "$mach_arch"
            if [[ "$signed" == true ]]; then
              codesign --verify --deep --strict -R "$requirement" "$app"
              while IFS= read -r -d '' binary; do
                if [[ "$(file -b "$binary")" == Mach-O* ]]; then
                  codesign --verify --strict -R "$requirement" "$binary"
                fi
              done < <(find "$app/Contents" -type f -print0)
              xcrun stapler validate "$app"
              codesign --verify --strict -R "$requirement" "$dmg"
              if ! xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" \
                --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
                --wait --output-format json | jq -e '.status == "Accepted"' >/dev/null; then
                printf 'Disk image notarization failed: %s\n' "$dmg" >&2
                exit 1
              fi
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
            fi
          }

          build_image arm64 arm64 apps/desktop/release/mac-arm64/Nesvo.app
          build_image x64 x86_64 apps/desktop/release/mac/Nesvo.app
          printf 'signed=%s\n' "$signed" >> "$GITHUB_OUTPUT"
      - name: Assess apps from the notarized disk images
        if: runner.os == 'macOS' && steps.mac-release.outputs.signed == 'true'
        shell: bash
        run: |
          sw_vers
          work="$(mktemp -d "$RUNNER_TEMP/nesvo-assessment.XXXXXX")"
          for arch in arm64 x64; do
            dmg="apps/desktop/release/Nesvo-macOS-$arch.dmg"
            volume="$work/$arch/volume"
            app="$work/$arch/Nesvo.app"
            mkdir -p "$volume"
            hdiutil attach -quiet -readonly -nobrowse -mountpoint "$volume" "$dmg"
            trap 'hdiutil detach -quiet "$volume" || true' EXIT
            ditto "$volume/Nesvo.app" "$app"
            hdiutil detach -quiet "$volume"
            trap - EXIT
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            assessment_status=0
            assessment="$(LC_ALL=C spctl -a -vv -t exec "$app" 2>&1)" || assessment_status=$?
            sed '/^origin=/d' <<< "$assessment"
            if [[ "$assessment_status" != 0 ]] ||
              ! grep -Fxq 'source=Notarized Developer ID' <<< "$assessment"; then
              printf '::warning::Runner Gatekeeper did not confirm notarized Developer ID for %s (exit %s).\n' "$arch" "$assessment_status"
            fi
            if ! syspolicy_check distribution "$app"; then
              printf '::warning::Runner system policy assessment reported an issue for %s.\n' "$arch"
            fi
          done
      - name: Check signed native package
        if: runner.os == 'macOS' && steps.mac-release.outputs.signed == 'true'
        shell: bash
        run: |
          package_dir=mac
          if [[ "$(uname -m)" == arm64 ]]; then
            package_dir=mac-arm64
          fi
          export NESVO_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/release/$package_dir/Nesvo.app/Contents/MacOS/Nesvo"
          bun run smoke:desktop:package
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nesvo-release-Windows
          path: apps/desktop/release/Nesvo-Windows-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload macOS disk images
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nesvo-release-macOS
          path: |
            apps/desktop/release/Nesvo-macOS-arm64.dmg
            apps/desktop/release/Nesvo-macOS-x64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: nesvo-release-*
          path: release
          merge-multiple: true
      - name: Generate installer checksums
        shell: bash
        working-directory: release
        run: |
          assets=(Nesvo-Windows-Setup.exe Nesvo-macOS-arm64.dmg Nesvo-macOS-x64.dmg)
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              printf 'Missing release asset: %s\n' "$asset" >&2
              exit 1
            fi
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish release assets
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(Nesvo-Windows-Setup.exe Nesvo-macOS-arm64.dmg Nesvo-macOS-x64.dmg SHA256SUMS.txt)
          if release="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease)"; then
            if [[ "$RELEASE_TAG" == v0.0.1-alpha.2 ]] &&
              ! jq -e '.isDraft and (.isPrerelease | not)' <<< "$release" >/dev/null; then
              printf 'Refusing to overwrite %s outside its validation draft.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            flags=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == v0.0.1-alpha.2 ]]; then
              flags+=(--draft)
            elif [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${flags[@]}"
          fi

name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run terminal:build
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:client
      - run: npx expo export --platform all
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path host/Cargo.toml --check
      - run: cargo clippy --manifest-path host/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path host/Cargo.toml
      - run: cargo build --manifest-path host/Cargo.toml
      - run: node --import tsx --test tests/host.integration.test.ts

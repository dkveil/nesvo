name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run terminal:build
      - run: npm run dependencies:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:client
      - run: npm run test:architecture
      - run: npm run test:packaging
      - run: npm run test:brand
      - run: npm run export
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      # Short process/pipe deadlines require dedicated serial conformance runs.
      # Exact names avoid selecting opt-in provider probes or helper entry points.
      - name: Verify declared statusline display process conformance
        run: cargo test --package nesvo-host --bin nesvo-host --locked claude_statusline::tests::capture_failure_does_not_change_input_stdout_or_display_exit -- --ignored --exact --test-threads=1
      - name: Verify Windows statusline raw standard handles
        if: runner.os == 'Windows'
        run: cargo test --package nesvo-host --bin nesvo-host --locked claude_statusline::tests::generated_windows_command_inherits_raw_standard_handles -- --ignored --exact --test-threads=1
      - run: cargo build --workspace --locked
      - name: Verify Windows development host probes and immutable runtime
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./tests/dev-host-probe.test.ps1
          & ./tests/dev-host-runtime.test.ps1
      # Each scenario owns a native host, provider probes and several PTYs.
      # Keep scenarios serial on shared runners; scenarios still test concurrent clients.
      - run: cargo test --package nesvo --test mcp_host --locked -- --ignored --test-threads=1
      - run: node --import tsx --test tests/host.integration.test.ts
      - run: npm run test:sync
      - run: cargo run --package nesvo --locked -- --help
      - run: npm run test:tui
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --package nesvo-host --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run terminal:build
      - name: Verify mobile UI and two-client live synchronization
        env:
          CI: '1'
          APP_URL: http://localhost:8081
        run: |
          npm run web --workspace @nesvo/mobile -- --port 8081 --max-workers 2 > /tmp/nesvo-metro.log 2>&1 &
          metro_pid=$!
          trap 'kill "$metro_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8081/status; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:8081/status
          npm run test:web
          npm run test:create-session
          npm run test:brand:web
          npm run test:live
          npm run test:terminal

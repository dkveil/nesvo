name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run terminal:build
      - run: npm run dependencies:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:client
      - run: npm run test:architecture
      - run: npm run test:packaging
      - run: npm run test:brand
      - run: npm run export
  rust-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo build --workspace --locked
      - name: Verify Windows development host probes and immutable runtime
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./tests/dev-host-probe.test.ps1
          & ./tests/dev-host-runtime.test.ps1
      - run: npm run test:host
      - run: npm run test:sync
      - run: cargo run --package nesvo --locked -- --help
      - run: npm run test:tui
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - run: cargo build --package nesvo-host --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run terminal:build
      - name: Verify mobile UI and two-client live synchronization
        env:
          CI: '1'
          APP_URL: http://localhost:8081
        run: |
          npm run web --workspace @nesvo/mobile -- --port 8081 --max-workers 2 > /tmp/nesvo-metro.log 2>&1 &
          metro_pid=$!
          trap 'kill "$metro_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8081/status; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:8081/status
          npm run test:web
          npm run test:create-session
          npm run test:brand:web
          npm run test:live
          npm run test:terminal

[package]
name = "nesvo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "nesvo: native terminal client for shared host sessions"
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap.workspace = true
crossterm = { version = "0.29", features = ["osc52"] }
futures-util.workspace = true
hex.workspace = true
nesvo-wire.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
url.workspace = true
vt100 = "0.16"

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process"] }

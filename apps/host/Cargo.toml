[package]
name = "nesvo-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local terminal companion for nesvo"
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "=0.10.4"
croner = { version = "=4.0.1", default-features = false, features = ["chrono"] }
ical = { package = "ical-rs", version = "=0.5.1", default-features = false, features = ["parser"] }
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
hex.workspace = true
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
nesvo-wire.workspace = true
portable-pty = "0.9.0"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17.14"
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "process", "io-util", "fs"] }
tokio-tungstenite.workspace = true
url.workspace = true
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

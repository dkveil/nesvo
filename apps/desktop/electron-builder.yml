appId: app.nesvo.desktop
productName: Nesvo
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - '!node_modules/**/*'
asar: true
npmRebuild: false
publish: null
extraFiles:
  - from: ../../LICENSE
    to: LICENSE.nesvo
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: THIRD_PARTY_DIFF_LICENSES.txt
    to: THIRD_PARTY_DIFF_LICENSES.txt
win:
  target:
    - zip
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  artifactName: Nesvo-Windows-Setup.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: [zip, dmg]
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: Nesvo-macOS-${arch}.${ext}
  sign: false
linux:
  target: tar.gz
  executableName: nesvo
  icon: build/icons
